[project]
name = "send-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.5.5",
    "httpx>=0.28.1",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "requests>=2.32.4",
    "rmq-service",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
rmq-service = { git = "https://github.com/imbalet/rmq_service" }

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"
