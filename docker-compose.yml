services:
  db:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DATABASES: ${POSTGRES_DATABASES}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.2
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RMQ_PASS}
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api-gateway:
    env_file:
      - .env
    stop_grace_period: 30s
    build:
      context: ./api-gateway/
      dockerfile: Dockerfile
    environment:
      AUTH_URL: http://auth-service:8000
      REMINDER_URL: http://reminder-service:8000
      USER_URL: http://user-service:8000
      JWKS_ENDPOINT: /.well-known/jwks.json
    networks:
      - app-network
    ports:
      - "${APP_PORT}:8000"
    restart: unless-stopped

  user-service:
    env_file:
      - .env
    stop_grace_period: 30s
    build:
      context: ./user-service/
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${USER_SERVICE_DB}
      RMQ_USER: ${RMQ_USER}
      RMQ_PASS: ${RMQ_PASS}
      RMQ_HOST: rabbitmq
      RMQ_PORT: 5672
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: sh -c "alembic upgrade head || exit 1 && exec uvicorn user_service.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  reminder-service:
    env_file:
      - .env
    stop_grace_period: 30s
    build:
      context: ./reminder-service/
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${REMINDER_SERVICE_DB}
      RMQ_USER: ${RMQ_USER}
      RMQ_PASS: ${RMQ_PASS}
      RMQ_HOST: rabbitmq
      RMQ_PORT: 5672
    command: sh -c "alembic upgrade head || exit 1 && exec uvicorn reminder_service.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  send-service:
    env_file:
      - .env
    stop_grace_period: 30s
    build:
      context: ./send-service/
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 5432
      RMQ_USER: ${RMQ_USER}
      RMQ_PASS: ${RMQ_PASS}
      RMQ_HOST: rabbitmq
      RMQ_PORT: 5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  auth-service:
    env_file:
      - .env
    stop_grace_period: 30s
    build:
      context: ./auth-service/
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${AUTH_SERVICE_DB}
      RMQ_USER: ${RMQ_USER}
      RMQ_PASS: ${RMQ_PASS}
      RMQ_HOST: rabbitmq
      RMQ_PORT: 5672
    volumes:
      - secrets:/app/.secrets
    command: sh -c "alembic upgrade head || exit 1 && exec uvicorn auth_service.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  confirm-service:
    env_file:
      - .env
    stop_grace_period: 30s
    build:
      context: ./confirm-service/
      dockerfile: Dockerfile
    environment:
      RMQ_PORT: 5672
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
  secrets:
