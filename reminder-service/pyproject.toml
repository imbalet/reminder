[project]
name = "reminder-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "fastapi>=0.115.14",
    "pydantic[email]>=2.11.7",
    "pydantic-settings>=2.10.1",
    "uvicorn>=0.35.0",
    "sqlalchemy>=2.0.41",
    "alembic>=1.16.2",
    "aio-pika>=9.5.5",
    "apscheduler>=3.11.0",
    "rmq-service",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "dotenv>=0.9.9",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
rmq-service = { git = "https://github.com/imbalet/rmq_service" }

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"
